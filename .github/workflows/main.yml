name: CI Workflow

# কোন কোন ইভেন্টে Workflow চালু হবে
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# কোড প্রসেস বা বিল্ড করার কাজের তালিকা
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. রিপোজিটরির কোড চেকআউট করা
    - name: Checkout repository
      uses: actions/checkout@v4

    # ২. Node.js সেটআপ (আপনার প্রজেক্ট অনুযায়ী এটি Python/Java তে পরিবর্তন করতে পারেন)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ৩. ডিপেন্ডেন্সি ইনস্টল করা
    - name: Install dependencies
      run: npm ci

    # ৪. টেস্ট রান করা (প্রযোজ্য হলে)
    - name: Run tests
      run: npm test
