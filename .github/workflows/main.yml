name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      # Repository download
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # Install Node dependencies if package.json exists
      - name: Install Node dependencies
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found - skipping npm install"
          fi

      # Install Python dependencies if requirements.txt exists
      - name: Install Python dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt found - skipping Python dependencies"
          fi

      # Run Python build script if available
      - name: Run Python build script
        shell: bash
        run: |
          if [ -f build.py ]; then
            python build.py
          else
            echo "No build.py found - skipping Python build"
          fi

      # Run JavaScript build if available
      - name: Build JavaScript project
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No package.json found - skipping JavaScript build"
          fi

      # Prepare GitHub Pages files
      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site

          # If a build output exists, use it
          if [ -d dist ]; then
            cp -r dist/. _site/

          elif [ -d build ]; then
            cp -r build/. _site/

          else
            # Static website files
            find . \
              -path './.git' -prune -o \
              -path './.github' -prune -o \
              -path './node_modules' -prune -o \
              -path './_site' -prune -o \
              -type f \
              \( \
                -name '*.html' -o \
                -name '*.css' -o \
                -name '*.js' -o \
                -name '*.json' -o \
                -name '*.png' -o \
                -name '*.jpg' -o \
                -name '*.jpeg' -o \
                -name '*.gif' -o \
                -name '*.svg' -o \
                -name '*.webp' -o \
                -name '*.ico' -o \
                -name '*.txt' \
              \) \
              -exec cp --parents {} _site/ \;
          fi

          # Make sure index.html exists
          if [ ! -f _site/index.html ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo "Website prepared successfully."
          find _site -maxdepth 3 -type f

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
